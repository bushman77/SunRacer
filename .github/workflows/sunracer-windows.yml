name: Build SunRacer Windows installer

on:
  push:
    branches: [native_client, story_line]
    paths:
      - "mix.exs"
      - "scripts/sunracer-version.py"
      - "clients/tauri/**"
      - "apps/sunracer_web/assets/js/game/**"
      - "apps/sunracer_web/assets/js/native_game.js"
      - "apps/sunracer_web/lib/sunracer_web/controllers/game_html/show.html.heex"
      - "apps/sunracer_web/assets/css/app.css"
      - "config/config.exs"
      - "config/dev.exs"
      - "apps/sunracer_web/assets/package-lock.json"
      - "apps/sunracer_web/priv/static/images/game/**"
      - ".github/workflows/sunracer-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Check out story_line source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate installer metadata from umbrella mix.exs
        run: python scripts/sunracer-version.py sync

      - name: Set up Windows Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: clients/tauri
        run: npm ci

      - name: Set up Elixir/OTP for local game asset compilation
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.4'

      - name: Install shared renderer dependencies
        run: npm ci --prefix apps/sunracer_web/assets

      - name: Test launcher
        working-directory: clients/tauri
        run: npm test

      - name: Generate Windows ICO from existing SunRacer PNG
        working-directory: clients/tauri
        run: npm exec -- tauri icon src-tauri/icons/128x128.png

      - name: Build Windows NSIS installer
        working-directory: clients/tauri
        run: npm run build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sunracer-windows-x86_64
          if-no-files-found: error
          path: clients/tauri/src-tauri/target/release/bundle/nsis/*.exe
