name: Verify SBS LAN TLS pairing proof

on:
  push:
    branches: [star_base]
    paths:
      - "clients/tauri/src-tauri/src/sbs_relay_probe.rs"
      - "clients/tauri/src-tauri/src/network.rs"
      - "clients/tauri/src-tauri/src/main.rs"
      - "clients/tauri/src-tauri/Cargo.toml"
      - "clients/tauri/src-tauri/Cargo.lock"
      - "clients/tauri/src-tauri/build.rs"
      - "clients/tauri/src-tauri/tauri.conf.json"
      - "apps/darkorbit_web/assets/js/game/helmet_relay_test.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_relay_test_test.mjs"
      - "apps/darkorbit_web/assets/js/game/helmet_control.mjs"
      - "apps/darkorbit_web/assets/js/game/sbs_relay_world*.mjs"
      - "apps/darkorbit_web/lib/darkorbit_web/channels/helmet_channel.ex"
      - "apps/darkorbit_web/assets/js/game/helmet_client.mjs"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/game_html/show.html.heex"
      - "apps/darkorbit_web/lib/darkorbit_web/controllers/helmet_html/show.html.heex"
      - "clients/tauri/ui/index.html"
      - "clients/tauri/scripts/dev-sbs-relay.sh"
      - "clients/tauri/tests/sbs_relay_probe.test.mjs"
      - ".github/workflows/sbs-relay-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check apps/darkorbit_web/assets/js/game/helmet_control.mjs
          node --check apps/darkorbit_web/assets/js/game/helmet_client.mjs
          node --check apps/darkorbit_web/assets/js/game/helmet_relay_test.mjs
          node --check apps/darkorbit_web/assets/js/game/sbs_relay_world.mjs
          node --test apps/darkorbit_web/assets/js/game/sbs_relay_world_test.mjs
          node --test apps/darkorbit_web/assets/js/game/helmet_relay_test_test.mjs
          node --test clients/tauri/tests/launcher_markup.test.mjs clients/tauri/tests/sbs_relay_probe.test.mjs clients/tauri/tests/native_game_markup.test.mjs
          bash -n clients/tauri/scripts/dev-sbs-relay.sh
  rust-probe-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/tauri/src-tauri
      - name: Install Tauri Linux toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Stage minimal local Tauri page for generate_context in headless CI
        run: |
          mkdir -p clients/tauri/dist/ui
          cp clients/tauri/ui/index.html clients/tauri/dist/ui/index.html
      - name: Compile and run native LAN relay and launcher guard tests from locked dependencies
        run: |
          cargo test --locked --manifest-path clients/tauri/src-tauri/Cargo.toml sbs_relay_probe::tests -- --nocapture
          cargo test --locked --manifest-path clients/tauri/src-tauri/Cargo.toml network::tests -- --nocapture
