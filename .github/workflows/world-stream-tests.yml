name: World stream JS regression tests

on:
  push:
    branches: [native_client, story_line]
    paths:
      - "apps/sunracer_web/assets/js/game/world_stream_delta*"
      - "apps/sunracer_web/assets/js/game/own_ship_movement_preview*"
      - "apps/sunracer_web/assets/js/game/own_ship_pose_policy*"
      - "apps/sunracer_web/assets/js/game/own_ship_camera_reconciler*"
      - "apps/sunracer_web/assets/js/game/desktop_mouse_sampling*"
      - "apps/sunracer_web/assets/js/game/client_led_mouse_camera*"
      - "apps/sunracer_web/assets/js/game/flight_input_integration_test.mjs"
      - "apps/sunracer_web/assets/js/game/client.js"
      - ".github/workflows/world-stream-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify state reconstruction and resync behavior
        run: |
          node --test \
            apps/sunracer_web/assets/js/game/world_stream_delta_test.mjs \
            apps/sunracer_web/assets/js/game/own_ship_movement_preview_test.mjs \
            apps/sunracer_web/assets/js/game/own_ship_pose_policy_test.mjs \
            apps/sunracer_web/assets/js/game/own_ship_camera_reconciler_test.mjs \
            apps/sunracer_web/assets/js/game/desktop_mouse_sampling_test.mjs \
            apps/sunracer_web/assets/js/game/client_led_mouse_camera_test.mjs \
            apps/sunracer_web/assets/js/game/flight_input_integration_test.mjs
